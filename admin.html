<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Адмін-панель — TS Розклад</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a10;--bg2:#0d1020;--bg3:#131828;--border:#1e2540;--text:#e8eef8;--text2:#98a8c8;--text3:#5a6888;--accent:#2563eb;--accent2:#60a5fa;--danger:#ef4444;--warn:#f59e0b;--success:#10b981;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;min-height:100vh;padding:20px}h1{font-family:Orbitron,sans-serif;font-size:22px;margin-bottom:4px;background:linear-gradient(135deg,#60a5fa,#2563eb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.sub{color:var(--text3);font-size:13px;margin-bottom:18px}.state{padding:40px 20px;text-align:center;color:var(--text2)}.state.err{color:var(--danger)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn,.refresh{border:none;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}.refresh{background:var(--accent);color:#fff}.btn.blue{background:rgba(37,99,235,.15);color:var(--accent2)}.btn.ban{background:rgba(245,158,11,.15);color:var(--warn)}.btn.unban{background:rgba(16,185,129,.15);color:var(--success)}.btn.del{background:rgba(239,68,68,.15);color:var(--danger)}.btn.gray{background:rgba(152,168,200,.12);color:var(--text2)}.btn:disabled{opacity:.5;cursor:default}.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{background:var(--bg2);color:var(--text2);border:1px solid var(--border);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:800}.tab.active{background:rgba(37,99,235,.18);color:var(--accent2);border-color:rgba(96,165,250,.35)}.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px 9px;text-align:left;font-size:12px;border-bottom:1px solid var(--border);vertical-align:top}th{color:var(--text3);font-weight:800;text-transform:uppercase;font-size:10px;letter-spacing:.5px}tr:last-child td{border-bottom:none}.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2)}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800}.badge.ok{background:rgba(16,185,129,.15);color:var(--success)}.badge.banned{background:rgba(239,68,68,.15);color:var(--danger)}.badge.admin{background:rgba(96,165,250,.15);color:var(--accent2)}.iplist{display:flex;gap:4px;flex-wrap:wrap}.ip{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--bg3);padding:3px 5px;border-radius:5px;color:var(--text2)}.muted{color:var(--text3)}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px}.box{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.box h2{font-size:18px;margin-bottom:5px}.box .hint{color:var(--text3);font-size:12px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.device{font-weight:800}.small{font-size:11px;color:var(--text3);margin-top:3px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:11px;color:var(--text3);font-weight:800}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg3);color:var(--text);font:inherit;outline:none}.field textarea{min-height:70px;resize:vertical}.checks{display:grid;gap:8px;padding:10px 0}.check{display:flex;gap:8px;align-items:center;color:var(--text2);font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.dangerbox{padding:10px;border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.06);border-radius:10px;color:#fca5a5;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--text3)}.security-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.security-item{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg3)}.security-item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.security-item .detail{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.4}.security-summary{padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--bg2);margin-bottom:12px}.security-summary.pass{border-color:rgba(16,185,129,.35)}.security-summary.warn{border-color:rgba(245,158,11,.35)}.security-summary.fail{border-color:rgba(239,68,68,.4)}@media(max-width:700px){body{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.security-grid{grid-template-columns:1fr}}

/* v5 admin visual layer */
body{background:radial-gradient(circle at 12% 0%,rgba(37,99,235,.13),transparent 30%),radial-gradient(circle at 92% 8%,rgba(139,92,246,.10),transparent 26%),var(--bg);max-width:1500px;margin:0 auto}
.admin-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 2px 20px;margin-bottom:4px}
.hero-kicker{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--accent2);font-weight:900;margin-bottom:6px}
.hero-title{display:flex;align-items:center;gap:10px;font-family:Orbitron,sans-serif;font-size:24px;font-weight:900}
.hero-title .shield{filter:drop-shadow(0 0 10px rgba(96,165,250,.35))}
.hero-meta{color:var(--text3);font-size:12px;margin-top:6px}
.hero-chip{border:1px solid rgba(96,165,250,.22);background:rgba(37,99,235,.10);color:var(--accent2);padding:8px 11px;border-radius:12px;font-size:11px;font-weight:800;white-space:nowrap}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{position:relative;overflow:hidden;padding:16px;border-radius:16px;background:linear-gradient(145deg,rgba(19,24,40,.98),rgba(13,16,32,.98));box-shadow:0 10px 35px rgba(0,0,0,.18)}
.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-35px;top:-35px;background:rgba(96,165,250,.08);filter:blur(2px)}
.stat b{font-size:25px;font-family:'JetBrains Mono',monospace}
.stat span{font-size:10px;letter-spacing:.7px;text-transform:uppercase}
.tabs{gap:8px}
.tab{transition:.2s transform,.2s border-color,.2s background;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tab:hover{transform:translateY(-1px)}
.panel{background:rgba(13,16,32,.88);box-shadow:0 16px 50px rgba(0,0,0,.20)}
th{position:sticky;top:0;background:var(--bg2);z-index:2}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(96,165,250,.035)}
.btn,.refresh{transition:.16s transform,.16s filter}
.btn:hover,.refresh:hover{transform:translateY(-1px);filter:brightness(1.08)}
.modal{background:rgba(2,4,10,.80)}
.box{box-shadow:0 25px 90px rgba(0,0,0,.65);border-color:rgba(96,165,250,.18)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.admin-hero{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.hero-title{font-size:20px}}
</style>
</head>
<body>
<div class="admin-hero"><div><div class="hero-kicker">TS_Daily · Security Center</div><div class="hero-title"><span class="shield">🛡️</span> Адмін-панель</div><div class="hero-meta">Керування акаунтами, сесіями, IP та безпекою</div></div><div class="hero-chip">● СИСТЕМА ОНЛАЙН</div></div>
<div id="root"><div class="state">Завантаження...</div></div>

<div class="modal" id="modal">
  <div class="box" id="modalBox"></div>
</div>

<script>
const API='/.netlify/functions/admin';
let users=[], currentTab='users', currentAdmin='', currentIsMaster=false;
function getDeviceId(){let id=localStorage.getItem('ts_device_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));localStorage.setItem('ts_device_id',id);}return id;}
function authHeaders(){return localStorage.getItem('ts_authed')==='1'?{'X-TS-Device-ID':getDeviceId()}:{} }
let adminReauthPromise=null;
async function rawAdmin(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));return {r,d}}
async function ensureAdminReauth(){
  if(adminReauthPromise)return adminReauthPromise;
  adminReauthPromise=(async()=>{
    const password=prompt('🔐 Пароль адмінки\n\nДля критичної операції введи ОКРЕМИЙ пароль адмінки.\nВін не зберігається в браузері.');
    if(password===null||!password)return false;
    const {r,d}=await rawAdmin('reauth-admin',{password});
    if(r.status===409&&d.setupRequired){
      if(confirm('Окремий пароль адмінки ще не створено. Створити його зараз?')){await setupAdminPassword();}
      return false;
    }
    if(!r.ok){alert('❌ '+(d.error||'Не вдалося перевірити пароль адмінки'));return false;}
    if(d.requires2FA){
      const code=prompt(`📧 Код на email ${d.emailMasked||'адміністратора'}\n\nВведи 6-значний код із листа. Код дійсний 10 хвилин.`);
      if(code===null||!code)return false;
      const v=await rawAdmin('verify-admin-2fa',{code});
      if(!v.r.ok){alert('❌ '+(v.d.error||'Невірний код 2FA'));return false;}
    }
    return true;
  })().finally(()=>{adminReauthPromise=null});
  return adminReauthPromise;
}
async function setupAdminPassword(){
  const currentPassword=prompt('🔐 Введи поточний пароль\n\nЯкщо окремий пароль адмінки вже створено — введи саме його.\nЯкщо це перше налаштування — введи пароль звичайного акаунта.');
  if(currentPassword===null||!currentPassword)return false;
  const newPassword=prompt('🔑 Створи окремий пароль адмінки\n\nМінімум 12 символів. Не використовуй пароль звичайного акаунта.');
  if(newPassword===null||!newPassword)return false;
  const confirmPassword=prompt('🔑 Повтори пароль адмінки');
  if(confirmPassword===null||!confirmPassword)return false;
  const {r,d}=await rawAdmin('setup-admin-password-start',{currentPassword,newPassword,confirmPassword});
  if(!r.ok){alert('❌ '+(d.error||'Не вдалося розпочати налаштування'));return false;}
  const code=prompt(`📧 Код на email ${d.emailMasked||'адміністратора'}\n\nВведи 6-значний код для завершення створення пароля адмінки.`);
  if(code===null||!code)return false;
  const v=await rawAdmin('setup-admin-password-verify',{code});
  if(!v.r.ok){alert('❌ '+(v.d.error||'Не вдалося створити пароль адмінки'));return false;}
  alert(v.d.changed ? '✅ Пароль адмінки змінено. Інші адмінські сесії завершено.' : '✅ Окремий пароль адмінки створено.');
  return true;
}

async function callAdmin(action,extra={},retry=true){
  let {r,d}=await rawAdmin(action,extra);
  if(r.status===428&&d.requiresAdminReauth&&retry){
    const ok=await ensureAdminReauth();
    if(ok)return callAdmin(action,extra,false);
  }
  if(!r.ok)throw new Error(d.error||'Помилка');
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ts){return ts?new Date(ts).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

async function load(){
  const root=document.getElementById('root');
  if(localStorage.getItem('ts_authed')!=='1'){root.innerHTML='<div class="state err">Увійди в основному застосунку на цьому пристрої.</div>';return}
  root.innerHTML='<div class="state">Завантаження...</div>';
  try{const d=await callAdmin('list-users');users=d.users||[];currentAdmin=d.currentAdmin||'';currentIsMaster=!!d.currentIsMaster;render()}
  catch(e){root.innerHTML=`<div class="state err">❌ ${esc(e.message)}</div>`}
}
function render(){
  const root=document.getElementById('root');
  const active=users.filter(u=>!u.banned).length,banned=users.filter(u=>u.banned).length,admins=users.filter(u=>u.role==='admin').length,sessions=users.reduce((n,u)=>n+u.sessionsCount,0);
  root.innerHTML=`<div id="security-alert-bar" style="display:none;margin-bottom:12px"></div><div class="stats"><div class="stat"><b>${users.length}</b><span>Користувачів</span></div><div class="stat"><b>${active}</b><span>Активних</span></div><div class="stat"><b>${banned}</b><span>Заблокованих</span></div><div class="stat"><b>${sessions}</b><span>Активних сесій</span></div></div>
  <div class="tabs"><button class="tab ${currentTab==='users'?'active':''}" onclick="switchTab('users')">👥 Користувачі</button><button class="tab ${currentTab==='security'?'active':''}" onclick="switchTab('security')">🛡️ Безпека</button><button class="tab ${currentTab==='ips'?'active':''}" onclick="switchTab('ips')">🚫 IP-блокування</button><button class="tab ${currentTab==='audit'?'active':''}" onclick="switchTab('audit')">📋 Журнал</button><button class="tab ${currentTab==='storage'?'active':''}" onclick="switchTab('storage')">📦 Сховище</button></div>
  <div id="content"></div>`;
  if(currentTab==='users')renderUsers();else if(currentTab==='security')renderSecurityPanel();else if(currentTab==='ips')renderIps();else if(currentTab==='storage')renderStorage();else renderAudit();loadSecurityAlerts();
}
async function loadSecurityAlerts(){try{const r=await fetch('/.netlify/functions/security-alerts',{cache:'no-store',credentials:'same-origin',headers:authHeaders()});const d=await r.json();const el=document.getElementById('security-alert-bar');if(!el)return;if(!r.ok||!d.count){el.style.display='none';return;}el.style.display='block';el.innerHTML=`<div class="dangerbox" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>🚨 Підозрілі події за 24 години: ${d.count}</b><span>${d.critical?'🔴 Критичних: '+d.critical:'🟠 Потрібна увага'}</span></div>`;}catch{}}
function switchTab(t){currentTab=t;render();if(t==='security')loadSecurityCheck();if(t==='ips')loadIps();if(t==='audit')loadAudit();if(t==='storage')loadStorage()}
function renderSecurityPanel(){
  const c=document.getElementById('content');
  c.innerHTML=`<div class="panel"><div class="toolbar"><button class="refresh" onclick="loadSecurityCheck()">🛡️ Запустити перевірку</button><span class="muted" style="align-self:center">Перевірка безпечна: без зміни паролів, сесій, банів або даних користувачів.</span></div><div id="securityResult"><div class="state">Натисни «Запустити перевірку».</div></div></div>`;
}
async function loadSecurityCheck(){
  const c=document.getElementById('content');
  if(!c){render();return loadSecurityCheck()}
  c.innerHTML=`<div class="panel"><div class="state">🛡️ Виконується перевірка безпеки...</div></div>`;
  const checks=[];
  try{
    const d=await callAdmin('security-check');
    checks.push(...(d.checks||[]));
  }catch(e){c.innerHTML=`<div class="panel state err">❌ Не вдалося виконати серверну перевірку: ${esc(e.message)}</div>`;return}
  // Browser-side checks verify the deployed site's real response headers and cookie behavior.
  try{
    const r=await fetch(location.href,{cache:'no-store',credentials:'same-origin'});
    const csp=r.headers.get('content-security-policy')||'';
    checks.push({id:'csp',label:'CSP HTTP-заголовок',status:csp.includes('frame-ancestors')&&csp.includes("object-src 'none'")?'PASS':'WARN',detail:csp?'CSP отримано з HTTP-заголовка.':'CSP HTTP-заголовок не знайдено.'});
  }catch(e){checks.push({id:'csp',label:'CSP HTTP-заголовок',status:'WARN',detail:'Не вдалося прочитати заголовок у браузері.'})}
  checks.push({id:'https',label:'HTTPS / secure context',status:location.protocol==='https:'?'PASS':'FAIL',detail:location.protocol==='https:'?'Сайт працює через HTTPS.':'Адмінка не працює через HTTPS.'});
  checks.push({id:'cookie-js',label:'Session cookie недоступна JavaScript',status:document.cookie.includes('__Host-ts_session')?'FAIL':'PASS',detail:document.cookie.includes('__Host-ts_session')?'HttpOnly cookie видно JavaScript — це проблема.':'Сесійна cookie не читається JavaScript.'});
  if('serviceWorker' in navigator){
    try{const reg=await navigator.serviceWorker.getRegistration();checks.push({id:'sw',label:'Service Worker',status:reg?'PASS':'WARN',detail:reg?'Service Worker зареєстрований.':'Service Worker не зареєстрований.'});}catch(e){checks.push({id:'sw',label:'Service Worker',status:'WARN',detail:'Не вдалося перевірити реєстрацію.'})}
  }else checks.push({id:'sw',label:'Service Worker',status:'WARN',detail:'Браузер не підтримує Service Worker.'});
  try{
    const r=await fetch('/.netlify/functions/session-status',{cache:'no-store',credentials:'same-origin',headers:{'X-TS-Device-ID':getDeviceId()}});
    const cc=(r.headers.get('cache-control')||'').toLowerCase();
    checks.push({id:'session-cache',label:'Session API no-store',status:cc.includes('no-store')?'PASS':'WARN',detail:cc?`Cache-Control: ${cc}`:'Cache-Control не повернуто.'});
  }catch(e){checks.push({id:'session-cache',label:'Session API no-store',status:'WARN',detail:'Не вдалося перевірити заголовок.'})}
  const pass=checks.filter(x=>x.status==='PASS').length,warn=checks.filter(x=>x.status==='WARN').length,fail=checks.filter(x=>x.status==='FAIL').length,total=checks.length;
  const overall=fail?'fail':warn?'warn':'pass';
  const title=fail?'❌ Є критичні проблеми':warn?'⚠️ Є попередження':'✅ Стан безпеки нормальний';
  const result=`<div class="security-summary ${overall}"><b style="font-size:16px">${title}</b><div class="small" style="margin-top:5px">PASS: ${pass} · WARN: ${warn} · FAIL: ${fail} · Всього: ${total}</div><div class="small">Перевірено: ${fmt(Date.now())}</div></div><div class="security-grid">${checks.map(x=>`<div class="security-item"><div class="top"><b>${esc(x.label)}</b><span class="badge ${x.status==='PASS'?'ok':x.status==='FAIL'?'banned':''}">${x.status}</span></div><div class="detail">${esc(x.detail||'')}</div></div>`).join('')}</div>`;
  c.innerHTML=`<div class="panel"><div class="toolbar"><button class="refresh" onclick="loadSecurityCheck()">🔄 Перевірити ще раз</button><span class="muted" style="align-self:center">Остання перевірка: ${fmt(Date.now())}</span></div>${result}</div>`;
}
async function renderStorage(){const c=document.getElementById('content');c.innerHTML='<div class="panel state">📦 Завантаження сховища...</div>';try{const [r,e]=await Promise.all([fetch('/.netlify/functions/storage-admin',{cache:'no-store',credentials:'same-origin',headers:authHeaders()}),fetch('/.netlify/functions/email-guard-stats',{cache:'no-store',credentials:'same-origin',headers:authHeaders()})]);const d=await r.json(),m=await e.json();if(!r.ok)throw new Error(d.error||'Помилка');c.innerHTML=`<div class="stats"><div class="stat"><b>${(d.total/1048576).toFixed(1)} MB</b><span>Зайнято</span></div><div class="stat"><b>${d.count}</b><span>Файлів</span></div><div class="stat"><b>${d.users}</b><span>Користувачів із файлами</span></div><div class="stat"><b>${m.daily}/${m.dailyLimit}</b><span>Email сьогодні</span></div></div><div class="panel"><h2>📦 Сховище</h2><div class="hint">Файли приватні та доступні лише власнику нотатки.</div><button class="btn gray" onclick="cleanupStorage()">🧹 Очистити осиротілі файли</button></div><div class="panel" style="margin-top:10px"><h2>📧 Email Guard</h2><div class="hint">Сьогодні ${m.daily}/${m.dailyLimit}; година ${m.hourly}/${m.hourlyLimit}; хвилина ${m.minute}/${m.minuteLimit}; залишок дня ${m.remainingDaily}.</div></div>`}catch(e){c.innerHTML=`<div class="panel state err">❌ ${esc(e.message)}</div>`}}
async function cleanupStorage(){if(!confirm('Очистити лише осиротілі файли, які не мають запису прив’язки?'))return;try{const d=await callAdmin('storage-delete-orphans');alert('✅ Видалено осиротілих файлів: '+d.deleted);renderStorage()}catch(e){alert('❌ '+e.message)}}
function renderUsers(){
  const c=document.getElementById('content');
  if(!users.length){c.innerHTML='<div class="panel state">Ще немає акаунтів.</div>';return}
  const rows=users.map(u=>`<tr>
  <td><b>${esc(u.username)}</b><br>${u.isMaster?'<span class="badge admin">ГОЛОВНИЙ АДМІН</span>':u.role==='admin'?'<span class="badge admin">АДМІН</span>':'<span class="badge">USER</span>'}</td>
  <td class="mono">${esc(u.email||'—')}<br>${u.emailVerified?'✅ підтверджено':'⚪ не підтверджено'}</td>
  <td class="mono">${u.sessionsCount}<br><button class="btn blue" onclick='showSessions(${JSON.stringify(u.username)})'>Пристрої</button></td>
  <td><div class="iplist">${(u.ips||[]).map(x=>`<span class="ip">${esc(x)}</span>`).join('')||'<span class="muted">—</span>'}</div></td>
  <td class="mono">${fmt(u.lastActive)}</td>
  <td>${u.banned?'<span class="badge banned">ЗАБЛОКОВАНО</span>':'<span class="badge ok">АКТИВНИЙ</span>'}</td>
  <td style="white-space:nowrap">
    ${u.username===currentAdmin?'<span class="badge admin" title="Власний акаунт">ЦЕ ВИ</span>':(u.isMaster?'<span class="badge admin" title="Головного адміністратора не можна блокувати або змінювати">ЗАХИЩЕНО</span>':(!currentIsMaster&&u.role==='admin'?'<span class="badge admin" title="Звичайний адміністратор не може керувати іншим адміністратором">ЗАХИЩЕНО</span>':''))}
    <button class="btn blue" onclick='showAccountDetails(${JSON.stringify(u.username)})'>🔎 Деталі</button>
    ${u.username!==currentAdmin && !u.isMaster && (currentIsMaster || u.role!=='admin')?`<button class="btn blue" onclick='editEmail(${JSON.stringify(u.username)},${JSON.stringify(u.email||'')})'>✉️ Email</button>
    <button class="btn blue" onclick="editRole('${esc(u.username)}','${u.role||'user'}')">👑 Роль</button>
    <button class="btn ${u.banned?'unban':'ban'}" onclick='showBan(${JSON.stringify(u.username)},${u.banned})'>${u.banned?'Розблокувати':'Заблокувати'}</button>
    <button class="btn del" onclick='showDelete(${JSON.stringify(u.username)})'>Видалити</button>`:''}
  </td></tr>`).join('');
  c.innerHTML=`<div class="panel"><div class="toolbar"><button class="refresh" onclick="load()">🔄 Оновити</button><button class="btn blue" onclick="setupAdminPassword()">🔐 Пароль адмінки</button><a class="btn gray" href="/admin-recovery.html" style="text-decoration:none">🆘 Аварійне відновлення</a></div><div class="wrap"><table><thead><tr><th>Користувач</th><th>Email</th><th>Сесії</th><th>IP</th><th>Активність</th><th>Статус</th><th>Дії</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function showAccountDetails(username){
  callAdmin('account-details',{username}).then(d=>{
    const p=d.profile||{}, sessions=d.sessions||[], activity=d.activity||[];
    const sessionRows=sessions.map(x=>`<div class="row"><div><b>${esc(x.device?.type||'💻')} · ${esc(x.device?.os||'')} · ${esc(x.device?.browser||'')}</b><div class="small mono">IP: ${esc(x.ip)} · створено: ${fmt(x.createdAt)} · активність: ${fmt(x.lastActive)} · до: ${fmt(x.expiresAt)}</div><div class="small">${esc(x.userAgent||'')}</div></div><button class="btn del" onclick='revokeSession(${JSON.stringify(username)},${JSON.stringify(x.id)})'>Завершити</button></div>`).join('');
    const actRows=activity.map(x=>`<div class="row"><div><b>${esc(activityLabel(x.type))}</b><div class="small">${fmt(x.at)}</div><div class="small mono">${esc(JSON.stringify(x.details||{}))}</div></div></div>`).join('');
    openModal(`<h2>🔎 Акаунт: ${esc(username)}</h2><div class="hint">Створено: ${fmt(p.createdAt)} · Остання активність: ${fmt(p.lastActive)}</div>
      <div class="dangerbox" style="margin-bottom:12px">${p.banned?'🚫 Заблоковано: '+esc(p.banReason||'без причини')+' · до: '+(p.banExpiresAt?fmt(p.banExpiresAt):'назавжди'):'🟢 Акаунт активний'}<br>Email: ${esc(p.email||'—')} · ${p.emailVerified?'підтверджено':'не підтверджено'}</div>
      <h3>📱 Активні сесії (${sessions.length})</h3>${sessionRows||'<div class="state">Активних сесій немає.</div>'}
      <h3 style="margin-top:16px">📋 Історія дій (${activity.length})</h3>${actRows||'<div class="state">Історія порожня.</div>'}
      <div class="actions"><button class="btn gray" onclick="closeModal()">Закрити</button><button class="btn del" onclick='clearHistory(${JSON.stringify(username)})'>Очистити історію</button></div>`);
  }).catch(e=>alert('❌ '+e.message));
}
function activityLabel(type){const m={login:'Вхід', 'login-failed':'Невдалий вхід','login-challenge':'Потрібне підтвердження входу','login-email-verified':'Вхід підтверджено email','new-device-email':'Лист про новий пристрій',logout:'Вихід','session-ended':'Сесію завершено','password-changed':'Пароль змінено','password-reset-request':'Запит відновлення пароля','password-reset-completed':'Пароль відновлено','email-change-request':'Запит зміни email','email-changed':'Email змінено','admin-email-changed':'Email змінено адміністратором','admin-email-removed':'Email видалено адміністратором','account-banned':'Акаунт заблоковано','account-unbanned':'Акаунт розблоковано','security-settings-changed':'Змінено налаштування безпеки','account-created':'Акаунт створено','history-cleared':'Історію очищено'};return m[type]||type}
async function clearHistory(username){
  const phrase=prompt(`Це незворотне очищення історії акаунта ${username}.

Введи точно: CLEAR ${username}`);
  if(phrase===null)return;
  if(phrase!==`CLEAR ${username}`){alert('❌ Неправильне підтвердження. Історію не очищено.');return;}
  if(!confirm('Останнє підтвердження: остаточно очистити історію?'))return;
  try{await callAdmin('clear-account-history',{username,confirm:phrase});closeModal();alert('✅ Історію очищено.');}catch(e){alert('❌ '+e.message)}
}

function showSessions(username){
  callAdmin('list-sessions',{username}).then(d=>{
    const rows=(d.sessions||[]).map(s=>`<div class="row"><div><div class="device">${esc(s.device?.type||'💻')} · ${esc(s.device?.os||'')} · ${esc(s.device?.browser||'')}</div><div class="small mono">IP: ${esc(s.ip)} · створено: ${fmt(s.createdAt)} · активність: ${fmt(s.lastActive)}</div><div class="small">${esc(s.userAgent)}</div></div><button class="btn del" onclick="revokeSession('${esc(username)}','${esc(s.id)}')">Завершити</button></div>`).join('');
    openModal(`<h2>📱 Сесії: ${esc(username)}</h2><div class="hint">Активних сесій: ${(d.sessions||[]).length}</div>${rows||'<div class="state">Активних сесій немає.</div>'}<div class="actions"><button class="btn gray" onclick="closeModal()">Закрити</button><button class="btn del" onclick='revokeAll(${JSON.stringify(username)})'>Завершити всі</button></div>`);
  }).catch(e=>alert('❌ '+e.message))
}
async function revokeSession(username,id){if(!confirm(`Завершити цю сесію користувача ${username}?`))return;try{await callAdmin('revoke-session',{username,sessionId:id,confirm:`REVOKE ${username} ${id}`});showSessions(username);load()}catch(e){alert('❌ '+e.message)}}
async function revokeAll(username){if(!confirm('Завершити всі сесії цього користувача?'))return;try{await callAdmin('revoke-all-sessions',{username,confirm:`REVOKE ${username}`});closeModal();load()}catch(e){alert('❌ '+e.message)}}

function editEmail(username,current){
 const v=prompt(`Email для ${username}:`,current||'');if(v===null)return;const email=v.trim();
 if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('❌ Невірний формат email');return}
 callAdmin('update-email',{username,email,confirm:`EMAIL ${username}`}).then(d=>{
   if(d.confirmationSent){
     const code=prompt('Email змінено. Користувач має передати адміністратору код із листа. Якщо код уже отримано, введи його зараз для підтвердження:', '');
     if(code)callAdmin('confirm-admin-email',{username,code,confirm:`EMAIL-CONFIRM ${username}`}).then(()=>alert('✅ Код підтверджено.')).catch(e=>alert('❌ '+e.message));
     else alert('ℹ️ Email змінено, але код поки не підтверджено.');
   } else alert('✅ Збережено.');
   load();
 }).catch(e=>alert('❌ '+e.message));
}
function editRole(username,current){
  if(username===currentAdmin){alert('Це ваш поточний акаунт. Роль головного адміністратора визначається через ADMIN_USERNAME.');return}
  openModal(`<h2>👑 Роль: ${esc(username)}</h2><div class="field"><label>РОЛЬ</label><select id="roleSelect"><option value="user" ${current==='user'?'selected':''}>Користувач</option><option value="admin" ${current==='admin'?'selected':''}>Адміністратор</option></select></div><div class="actions"><button class="btn gray" onclick="closeModal()">Скасувати</button><button class="btn blue" onclick='saveRole(${JSON.stringify(username)})'>Зберегти</button></div>`);
}
async function saveRole(username){try{await callAdmin('set-role',{username,role:document.getElementById('roleSelect').value,confirm:`ROLE ${username}`});closeModal();load()}catch(e){alert('❌ '+e.message)}}

function showBan(username,isBanned){
 if(isBanned){if(!confirm(`Розблокувати ${username}?`))return;callAdmin('unban-user',{username,confirm:`UNBAN ${username}`}).then(()=>load()).catch(e=>alert('❌ '+e.message));return}
 openModal(`<h2>🚫 Заблокувати: ${esc(username)}</h2><div class="field"><label>ПРИЧИНА ДЛЯ КОРИСТУВАЧА</label><textarea id="banReason" placeholder="Наприклад: спам, порушення правил..."></textarea></div><div class="field"><label>ТЕРМІН БАНУ АКАУНТА</label><select id="banDuration"><option value="hour">1 година</option><option value="day">1 день</option><option value="week">7 днів</option><option value="forever" selected>Назавжди</option></select></div><div class="checks"><label class="check"><input id="blockIp" type="checkbox"> Одночасно заблокувати IP-адреси активних сесій</label></div><div class="field"><label>ТЕРМІН IP-БЛОКУ</label><select id="ipDuration"><option value="hour">1 година</option><option value="day">1 день</option><option value="week">7 днів</option><option value="forever" selected>Назавжди</option></select></div><div class="dangerbox">Бан акаунта одразу завершить усі його активні сесії.</div><div class="actions"><button class="btn gray" onclick="closeModal()">Скасувати</button><button class="btn del" onclick='doBan(${JSON.stringify(username)})'>Заблокувати</button></div>`);
}
async function doBan(username){try{await callAdmin('ban-user',{username,confirm:`BAN ${username}`,reason:document.getElementById('banReason').value,duration:document.getElementById('banDuration').value,blockIp:document.getElementById('blockIp').checked,ipDuration:document.getElementById('ipDuration').value});closeModal();load()}catch(e){alert('❌ '+e.message)}}
function showDelete(username){openModal(`<h2>🗑️ Видалити: ${esc(username)}</h2><div class="dangerbox">Це видалить акаунт і його серверні дані. Скасувати операцію після виконання не можна. Для критичної дії додатково знадобиться пароль адміністратора та точне підтвердження.</div><div class="checks"><label class="check"><input id="deleteBlockIp" type="checkbox"> Також заблокувати IP активних сесій</label></div><div class="field"><label>ТЕРМІН IP-БЛОКУ</label><select id="deleteIpDuration"><option value="hour">1 година</option><option value="day">1 день</option><option value="week">7 днів</option><option value="forever" selected>Назавжди</option></select></div><div class="actions"><button class="btn gray" onclick="closeModal()">Скасувати</button><button class="btn del" onclick='doDelete(${JSON.stringify(username)})'>Видалити</button></div>`)}
async function doDelete(username){if(!confirm(`Остаточно видалити ${username}?`))return;try{await callAdmin('delete-user',{username,confirm:`DELETE ${username}`,blockIp:document.getElementById('deleteBlockIp').checked,ipDuration:document.getElementById('deleteIpDuration').value});closeModal();load()}catch(e){alert('❌ '+e.message)}}

async function loadIps(){try{const d=await callAdmin('ip-list');renderIpList(d.bans||[])}catch(e){document.getElementById('content').innerHTML=`<div class="panel state err">❌ ${esc(e.message)}</div>`}}
function renderIps(bans){
 const c=document.getElementById('content');
 const rows=bans.map(b=>`<tr><td class="mono">${esc(b.ip)}</td><td>${esc(b.reason||'—')}</td><td>${esc(b.username||'—')}</td><td class="mono">${fmt(b.createdAt)}</td><td>${b.expiresAt?fmt(b.expiresAt):'Назавжди'}</td><td><button class="btn unban" onclick='unbanIp(${JSON.stringify(b.ip)})'>Розблокувати</button></td></tr>`).join('');
 c.innerHTML=`<div class="panel"><div class="toolbar"><button class="btn blue" onclick="showIpBan()">➕ Заблокувати IP вручну</button><button class="refresh" onclick="loadIps()">🔄 Оновити</button></div><div class="wrap"><table><thead><tr><th>IP</th><th>Причина</th><th>Користувач</th><th>Створено</th><th>До</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">Заблокованих IP немає.</td></tr>'}</tbody></table></div></div>`;
}
function showIpBan(){openModal(`<h2>🚫 Заблокувати IP</h2><div class="field"><label>IP-АДРЕСА</label><input id="manualIp" placeholder="185.123.45.67"></div><div class="field"><label>ПРИЧИНА</label><input id="manualReason" placeholder="Спам"></div><div class="field"><label>ТЕРМІН</label><select id="manualDuration"><option value="hour">1 година</option><option value="day">1 день</option><option value="week">7 днів</option><option value="forever">Назавжди</option></select></div><div class="actions"><button class="btn gray" onclick="closeModal()">Скасувати</button><button class="btn del" onclick="doIpBan()">Заблокувати</button></div>`)}
async function doIpBan(){try{await callAdmin('ip-ban',{ip:document.getElementById('manualIp').value.trim(),confirm:'BAN IP',reason:document.getElementById('manualReason').value,duration:document.getElementById('manualDuration').value});closeModal();loadIps()}catch(e){alert('❌ '+e.message)}}
async function unbanIp(ip){if(!confirm(`Розблокувати IP ${ip}?`))return;try{await callAdmin('ip-unban',{ip,confirm:'UNBAN IP'});loadIps()}catch(e){alert('❌ '+e.message)}}

async function loadAudit(){try{const d=await callAdmin('audit-log');const integrity=d.integrity||{};const integrityHtml=integrity.valid===false?'<div class="dangerbox" style="margin-bottom:12px">⚠️ Виявлено порушення цілісності журналу адміністратора. Перевірте серверні журнали та доступи.</div>':'<div class="hint">🔗 Цілісність журналу: '+(integrity.valid?'підтверджена':'невідома')+' · записів: '+esc(integrity.count??(d.log||[]).length)+'</div>';const rows=(d.log||[]).map(x=>`<div class="row"><div><b>${esc(x.action)}</b><div class="small">${fmt(x.at)} · адмін: ${esc(x.adminUsername)}</div><div class="small mono">${esc(JSON.stringify(x.details||{}))}</div></div></div>`).join('');document.getElementById('content').innerHTML=`<div class="panel">${integrityHtml}${rows||'<div class="state">Журнал порожній.</div>'}</div>`}catch(e){document.getElementById('content').innerHTML=`<div class="panel state err">❌ ${esc(e.message)}</div>`}}
load();
</script>
</body>
</html>
